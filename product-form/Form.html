<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:15px Arial,sans-serif;background:#FFF9F0;color:#292522;margin:0;padding:16px}.w{max-width:600px;margin:auto}h1{font:26px Georgia,serif;color:#641D2D;margin:6px 0}h2{font:20px Georgia,serif;color:#641D2D;border-top:1px solid #E8DCCB;padding-top:18px;margin-top:26px}
label{display:block;margin:14px 0 4px;font-weight:bold}input,select,textarea{width:100%;padding:10px;border:1px solid #cdb792;border-radius:4px;font:inherit;background:#fff;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid label{margin:0 0 3px;font-size:13px;text-align:center}button{background:#641D2D;color:#FFF9F0;border:0;padding:12px 20px;border-radius:4px;font:inherit;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}
#msg{margin-top:14px;padding:10px;border-radius:4px;display:none}.ok{background:#e6f2e6}.bad{background:#f8e0e0}#prev{max-width:180px;margin-top:8px;display:none}.hint{color:#77675b;font-size:13px}
.card{background:#fff;border:1px solid #E8DCCB;border-radius:6px;padding:12px;margin-top:12px}.card h3{margin:0 0 8px;font-size:15px}.card button{margin-top:10px;padding:8px 16px}.row{display:flex;gap:8px;align-items:center}</style></head><body><div class="w">
<h1>Touch of Tradition</h1><div class="hint">Add or manage products on the website</div>
<label>Passcode</label><input type="password" id="pass" autocomplete="off">
<h2>Add a product</h2>
<label>Product name</label><input id="name">
<label>Collection</label><select id="coll"><option value="">Choose…</option><option>Silk Sarees</option><option>Designer Sarees</option><option>Kurta / Ethnic Suits</option><option>Coord Sets</option><option>Jewellery</option><option>Bridal Edit</option></select>
<label>Price (USD)</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal">
<div id="szBox" style="display:none"><label>Quantity available per size</label><div class="hint">Leave a size blank if you do not offer it. Enter 0 if it is sold out.</div><div class="grid" id="szGrid" style="margin-top:6px"></div></div>
<div id="qBox"><label>Quantity available</label><input id="qty" type="number" min="0" step="1" inputmode="numeric"></div>
<label>Colour (optional)</label><input id="colour">
<label>Description (optional)</label><textarea id="desc" rows="3"></textarea>
<label>Photo</label><input type="file" id="photo" accept="image/*"><img id="prev" alt="Preview">
<label style="font-weight:normal"><input type="checkbox" id="feat" style="width:auto"> Feature this product (show first)</label>
<button id="add" onclick="add()">Add product</button><div id="msg"></div>
<h2>Manage products and stock</h2><div class="hint">Change quantities when you restock or after a sale. Customers only ever see "Sold out" when everything reaches 0.</div><button onclick="load()">Load my products</button><div id="list"></div>
</div><script>
const SIZES=["S","M","L","XL","XXL"],SIZED=["Kurta / Ethnic Suits","Coord Sets"],STAT=["In stock","Sold out","Hidden"];let IMG="";const $=id=>document.getElementById(id);
function say(m,ok){const e=$("msg");e.textContent=m;e.className=ok?"ok":"bad";e.style.display="block";e.scrollIntoView({block:"nearest"})}
function grid(vals){return SIZES.map(s=>`<div><label>${s}</label><input type="number" min="0" step="1" inputmode="numeric" data-s="${s}" value="${vals&&vals[s]!=null?vals[s]:""}"></div>`).join("")}
$("szGrid").innerHTML=grid();
function toggle(){const z=SIZED.includes($("coll").value);$("szBox").style.display=z?"block":"none";$("qBox").style.display=z?"none":"block"}
$("coll").onchange=toggle;toggle();
$("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const m=1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",.82);IMG=d.split(",")[1];$("prev").src=d;$("prev").style.display="block"};im.src=URL.createObjectURL(f)};
const stockOf=root=>{const o={};root.querySelectorAll("[data-s]").forEach(i=>o[i.dataset.s]=i.value);return o};
function add(){const b=$("add");b.disabled=true;say("Saving…",true);
 google.script.run.withSuccessHandler(m=>{say(m,true);b.disabled=false;["name","price","colour","desc","photo","qty"].forEach(i=>$(i).value="");$("feat").checked=false;$("szGrid").innerHTML=grid();IMG="";$("prev").style.display="none"}).withFailureHandler(e=>{say(e.message,false);b.disabled=false})
 .addProduct({passcode:$("pass").value,name:$("name").value,collection:$("coll").value,price:$("price").value,stock:stockOf($("szGrid")),qty:$("qty").value,colour:$("colour").value,description:$("desc").value,featured:$("feat").checked,image:IMG})}
function load(){google.script.run.withSuccessHandler(rows=>{const L=$("list");L.innerHTML="";if(!rows.length)return say("No products yet.",true);
 rows.forEach(r=>{const c=document.createElement("div");c.className="card";const h=document.createElement("h3");h.textContent=r.name+" ("+r.collection+", $"+r.price+")";c.append(h);
  const sel=document.createElement("select");STAT.forEach(x=>{const o=document.createElement("option");o.textContent=x;o.selected=x===r.status;sel.append(o)});
  const box=document.createElement("div");if(r.sized){box.className="grid";box.innerHTML=grid(r.sizes)}else{box.innerHTML='<input type="number" min="0" step="1" data-q value="'+(r.qty===""?"":r.qty)+'">'}
  const lab=document.createElement("div");lab.className="hint";lab.style.margin="8px 0 4px";lab.textContent=r.sized?"Quantity per size":"Quantity available";
  const btn=document.createElement("button");btn.textContent="Save";
  btn.onclick=()=>{btn.disabled=true;google.script.run.withSuccessHandler(()=>{btn.disabled=false;say("Saved: "+r.name,true)}).withFailureHandler(e=>{btn.disabled=false;say(e.message,false)}).updateProduct($("pass").value,r.id,sel.value,r.sized?{stock:stockOf(box)}:{qty:box.querySelector("[data-q]").value})};
  c.append(sel,lab,box,btn);L.append(c)})}).withFailureHandler(e=>say(e.message,false)).listProducts($("pass").value)}
</script></body></html>
